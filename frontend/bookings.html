<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bookings</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container" style="margin-top:30px; margin-bottom:30px;">
  <div class="page-header">
    <h2>Bookings <small>View all bookings and delete one booking</small></h2>
  </div>

  <div id="alerts"></div>

  <div class="panel panel-danger">
    <div class="panel-heading"><strong>Delete Booking</strong></div>
    <div class="panel-body">
      <p class="text-muted">Enter a confirmation code to permanently delete that booking.</p>
      <form id="delete-booking-form" class="form-inline">
        <div class="form-group">
          <label class="sr-only" for="delete-confirmation-code">Confirmation Code</label>
          <input
            id="delete-confirmation-code"
            type="text"
            class="form-control"
            placeholder="Confirmation Code"
            autocomplete="off"
            required
          >
        </div>
        <button type="submit" class="btn btn-danger">Delete Booking</button>
      </form>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-heading">
      <strong>All Bookings</strong>
      <button id="refresh-btn" class="btn btn-primary btn-xs pull-right">Refresh</button>
    </div>
    <div class="panel-body" id="bookings">
      <p class="text-muted" style="margin:0;">Loading bookings...</p>
    </div>
  </div>
</div>

<script>
  // Use the backend that served this page (local, staging, or production).
  var API = window.location.origin;

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showAlert(type, message) {
    document.getElementById('alerts').innerHTML =
      '<div class="alert alert-' + type + ' alert-dismissible" role="alert">' +
        '<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>' +
        escapeHtml(message) +
      '</div>';
  }

  function clearAlert() {
    document.getElementById('alerts').innerHTML = '';
  }

  function setLoading() {
    document.getElementById('bookings').innerHTML = '<p class="text-muted" style="margin:0;">Loading bookings...</p>';
  }

  function loadBookings(preserveAlert) {
    if (!preserveAlert) {
      clearAlert();
    }
    setLoading();

    return fetch(API + '/bookings/')
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Failed to load bookings (HTTP ' + response.status + ')');
        }
        return response.json();
      })
      .then(function(bookings) {
        renderBookings(bookings || []);
      })
      .catch(function(error) {
        document.getElementById('bookings').innerHTML = '<p class="text-danger" style="margin:0;">Could not load bookings.</p>';
        showAlert('danger', error.message || 'Could not load bookings');
      });
  }

  function deleteBooking(confirmationCode) {
    confirmationCode = String(confirmationCode || '').trim();
    if (!confirmationCode) {
      showAlert('danger', 'Please enter a confirmation code.');
      return;
    }

    var confirmed = window.confirm('Delete booking ' + confirmationCode + '? This cannot be undone.');
    if (!confirmed) {
      return;
    }

    fetch(API + '/bookings/' + encodeURIComponent(confirmationCode), {
      method: 'DELETE'
    })
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Failed to delete booking (HTTP ' + response.status + ')');
        }
        return response.json();
      })
      .then(function(result) {
        showAlert('success', 'Deleted booking ' + result.deleted + '. Removed ' + result.deleted_session_bookings + ' session booking link(s).');
        document.getElementById('delete-confirmation-code').value = '';
        return loadBookings(true);
      })
      .catch(function(error) {
        showAlert('danger', error.message || 'Could not delete booking');
      });
  }

  function renderBookings(bookings) {
    var container = document.getElementById('bookings');

    if (!bookings.length) {
      container.innerHTML = '<p class="text-muted" style="margin:0;">No bookings found.</p>';
      return;
    }

    var rows = bookings.map(function(booking) {
      var propertyAddress = booking.property && booking.property.address ? booking.property.address : '';
      return '<tr>' +
        '<td>' + escapeHtml(booking.confirmation_code) + '</td>' +
        '<td>' + escapeHtml(booking.status) + '</td>' +
        '<td>' + escapeHtml(booking.guest_name) + '</td>' +
        '<td>' + escapeHtml(booking.start_date) + '</td>' +
        '<td>' + escapeHtml(booking.end_date) + '</td>' +
        '<td>' + escapeHtml(booking.nights) + '</td>' +
        '<td>' + escapeHtml(booking.listing_number || booking.listing || '') + '</td>' +
        '<td>' + escapeHtml(propertyAddress) + '</td>' +
        '<td>' +
          '<button class="btn btn-danger btn-xs delete-booking" data-confirmation-code="' + escapeHtml(booking.confirmation_code) + '">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    container.innerHTML =
      '<div class="table-responsive">' +
        '<table class="table table-striped table-bordered table-condensed" style="margin-bottom:0;">' +
          '<thead>' +
            '<tr>' +
              '<th>Confirmation Code</th>' +
              '<th>Status</th>' +
              '<th>Guest</th>' +
              '<th>Start Date</th>' +
              '<th>End Date</th>' +
              '<th>Nights</th>' +
              '<th>Listing</th>' +
              '<th>Property</th>' +
              '<th>Action</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.delete-booking'), function(button) {
      button.addEventListener('click', function(event) {
        deleteBooking(event.target.getAttribute('data-confirmation-code'));
      });
    });
  }

  document.getElementById('refresh-btn').addEventListener('click', loadBookings);
  document.getElementById('delete-booking-form').addEventListener('submit', function(event) {
    event.preventDefault();
    deleteBooking(document.getElementById('delete-confirmation-code').value);
  });
  loadBookings();
</script>

</body>
</html>
