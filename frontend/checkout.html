<!DOCTYPE html>
<html lang="en">
<head>
  <title>Checkout Report</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    .checkout-table-wrap {
      max-height: 70vh;
      overflow-y: auto;
    }

    #checkout-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f5f5;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="container" style="margin-top:30px; margin-bottom:30px;">
  <div class="page-header">
    <h2>Bookings Checkout <small>Grouped endpoint view</small></h2>
  </div>

  <div class="panel panel-default">
    <div class="panel-body">
      <button class="btn btn-primary" id="reload-btn">
        <span class="glyphicon glyphicon-refresh"></span> Reload
      </button>
      <button class="btn btn-default" id="scroll-today-btn" style="margin-left:8px;">
        <span class="glyphicon glyphicon-calendar"></span> Go to Today
      </button>
      <button class="btn btn-default" id="this-week-btn" style="margin-left:8px;">
        <span class="glyphicon glyphicon-filter"></span> This week
      </button>
      <div class="form-inline" style="display:inline-block; margin-left:12px; vertical-align:middle;">
        <label for="session-cleaner-filter" class="control-label" style="margin-right:6px;">Sessions cleaner</label>
        <select id="session-cleaner-filter" class="form-control input-sm" style="min-width:180px;">
          <option value="">All cleaners</option>
          <option value="__unassigned">Unassigned sessions</option>
        </select>
      </div>
      <div class="form-inline" style="display:inline-block; margin-left:12px; vertical-align:middle;">
        <label for="session-paid-status-filter" class="control-label" style="margin-right:6px;">Paid status</label>
        <select id="session-paid-status-filter" class="form-control input-sm" style="min-width:150px;">
          <option value="unpaid" selected>Unpaid sessions</option>
          <option value="paid">Paid sessions</option>
          <option value="">All sessions</option>
        </select>
      </div>
      <span class="text-muted" id="filter-summary" style="margin-left:10px;"></span>
      <span class="text-muted" id="last-updated" style="margin-left:10px;"></span>
    </div>
  </div>

  <div id="alerts"></div>

  <div class="panel panel-default">
    <div class="panel-heading"><strong>Session details for new cleaning session</strong></div>
    <div class="panel-body">
      <div class="row">
        <div class="col-sm-2">
          <label for="start-time-input">Start Time</label>
          <input id="start-time-input" type="time" class="form-control input-sm" value="10:00">
        </div>
        <div class="col-sm-2">
          <label for="finish-time-input">Finish Time</label>
          <input id="finish-time-input" type="time" class="form-control input-sm" value="12:00">
        </div>
        <div class="col-sm-2">
          <label for="fix-cost-input">Fixed Cost</label>
          <input id="fix-cost-input" type="number" class="form-control input-sm" min="0" step="0.01" value="0">
        </div>
        <div class="col-sm-6">
          <label for="notes-input">Notes</label>
          <input id="notes-input" type="text" class="form-control input-sm" placeholder="Optional notes">
        </div>
      </div>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-heading"><strong>Checkout table</strong></div>
    <div class="table-responsive checkout-table-wrap">
      <table class="table table-striped table-bordered table-condensed" id="checkout-table" style="margin-bottom:0;">
        <thead>
          <tr>
            <th>Total (date)</th>
            <th>Checkout Date</th>
            <th>Property</th>
            <th>Property Count</th>
            <th>Listing #</th>
            <th>Sessions</th>
            <th>Time</th>
            <th>Fix Cost</th>
            <th>Cleaner</th>
            <th>Action</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="checkout-body">
          <tr><td colspan="11" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="edit-session-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="edit-session-modal-title">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" id="edit-session-modal-title">Edit cleaning session</h4>
      </div>
      <div class="modal-body">
        <div id="edit-session-alert"></div>
        <form id="edit-session-form">
          <input id="edit-session-id" type="hidden">
          <div class="row">
            <div class="col-sm-4">
              <label for="edit-cleaner-id">Cleaner</label>
              <select id="edit-cleaner-id" class="form-control input-sm"></select>
            </div>
            <div class="col-sm-4">
              <label for="edit-clean-date">Clean Date</label>
              <input id="edit-clean-date" type="date" class="form-control input-sm">
            </div>
            <div class="col-sm-4">
              <label for="edit-paid-status" style="display:block;">Paid Status</label>
              <label class="checkbox-inline">
                <input id="edit-paid-status" type="checkbox"> Paid
              </label>
            </div>
          </div>
          <div class="row" style="margin-top:12px;">
            <div class="col-sm-3">
              <label for="edit-start-time">Start Time</label>
              <input id="edit-start-time" type="time" class="form-control input-sm" value="10:00">
            </div>
            <div class="col-sm-3">
              <label for="edit-finish-time">Finish Time</label>
              <input id="edit-finish-time" type="time" class="form-control input-sm" value="12:00">
            </div>
            <div class="col-sm-3">
              <label for="edit-fix-cost">Fixed Cost</label>
              <input id="edit-fix-cost" type="number" class="form-control input-sm" min="0" step="0.01" value="0">
            </div>
            <div class="col-sm-3">
              <label for="edit-confirmation-codes">Confirmation Codes</label>
              <input id="edit-confirmation-codes" type="text" class="form-control input-sm" placeholder="CODE1, CODE2">
            </div>
          </div>
          <div class="row" style="margin-top:12px;">
            <div class="col-sm-12">
              <label for="edit-notes">Notes</label>
              <input id="edit-notes" type="text" class="form-control input-sm" placeholder="Optional notes">
            </div>
          </div>
        </form>
        <hr>
        <h5><strong>All sessions for this cleaner on this date</strong></h5>
        <div id="edit-session-related"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="edit-session-save-btn">Save changes</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Use the backend that served this page (local, staging, or production).
  var API = window.location.origin;
  var cleaners = [];
  var saveGroups = {};
  var checkoutData = [];
  var selectedSessionCleanerId = '';
  var selectedSessionPaidStatus = 'unpaid';
  var thisWeekFilterActive = false;

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function parseTimeToMinutes(value) {
    if (!value || !/^\d{2}:\d{2}$/.test(value)) {
      return null;
    }
    var parts = value.split(':');
    var hours = Number(parts[0]);
    var minutes = Number(parts[1]);
    if (!Number.isFinite(hours) || !Number.isFinite(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
      return null;
    }
    return (hours * 60) + minutes;
  }

  function durationFromTimeInputs(startInputId, finishInputId) {
    var startValue = document.getElementById(startInputId).value;
    var finishValue = document.getElementById(finishInputId).value;
    var startMinutes = parseTimeToMinutes(startValue);
    var finishMinutes = parseTimeToMinutes(finishValue);
    if (startMinutes == null || finishMinutes == null) {
      return { error: 'Please enter both start time and finish time.' };
    }
    if (finishMinutes <= startMinutes) {
      return { error: 'Finish time must be after start time.' };
    }
    var totalMinutes = finishMinutes - startMinutes;
    return {
      hours: Math.floor(totalMinutes / 60),
      minutes: totalMinutes % 60
    };
  }

  function finishTimeFromDuration(startValue, hours, minutes) {
    var startMinutes = parseTimeToMinutes(startValue);
    if (startMinutes == null) {
      return startValue;
    }
    var totalMinutes = Math.min((24 * 60) - 1, startMinutes + (hours * 60) + minutes);
    return String(Math.floor(totalMinutes / 60)).padStart(2, '0') + ':' +
      String(totalMinutes % 60).padStart(2, '0');
  }

  function sessionText(sessions) {
    if (!sessions || sessions.length === 0) return '<span class="label label-default">Unassigned</span>';
    return sessions.map(function(s) {
      var cleaner = s.cleaner_name ? escapeHtml(s.cleaner_name) : 'Unknown';
      return '<button type="button" class="btn btn-info btn-xs edit-session-btn" ' +
        'style="margin-right:4px; margin-bottom:3px;" ' +
        'data-session-id="' + escapeHtml(s.session_id) + '">' +
        '#' + escapeHtml(s.session_id) + ' - ' + cleaner +
      '</button>';
    }).join('');
  }

  function sessionTimeText(sessions) {
    if (!sessions || sessions.length === 0) return '<span class="text-muted">-</span>';
    return sessions.map(function(s) {
      var hours = Number.isFinite(Number(s.hours)) ? Math.max(0, Math.floor(Number(s.hours))) : 0;
      var minutes = Number.isFinite(Number(s.minutes)) ? Math.max(0, Math.floor(Number(s.minutes))) : 0;
      minutes = Math.min(59, minutes);
      return '<span class="label label-default" style="margin-right:4px; display:inline-block; margin-bottom:3px;">' +
        String(hours) + 'h ' + String(minutes).padStart(2, '0') + 'm</span>';
    }).join('');
  }

  function sessionFixCostText(sessions) {
    if (!sessions || sessions.length === 0) return '<span class="text-muted">-</span>';
    return sessions.map(function(s) {
      var fixCost = Number.isFinite(Number(s.fix_cost)) ? Math.max(0, Number(s.fix_cost)) : 0;
      return '<span class="label label-default" style="margin-right:4px; display:inline-block; margin-bottom:3px;">£' +
        fixCost.toFixed(2) + '</span>';
    }).join('');
  }

  function uniqueSessionsById(sessions) {
    var seen = {};
    return (sessions || []).filter(function(session) {
      if (!session || session.session_id == null) return false;
      if (seen[session.session_id]) return false;
      seen[session.session_id] = true;
      return true;
    });
  }

  function cleanerOptionsHtml(selectedCleanerId) {
    var options = '<option value=""></option>';
    options += cleaners.map(function(cleaner) {
      var selected = selectedCleanerId != null && String(cleaner.id) === String(selectedCleanerId);
      return '<option value="' + escapeHtml(cleaner.id) + '"' + (selected ? ' selected' : '') + '>' + escapeHtml(cleaner.name) + '</option>';
    }).join('');
    return options;
  }

  function normalizeSession(session, checkoutDate, confirmationCode) {
    var copy = {};
    Object.keys(session || {}).forEach(function(key) {
      copy[key] = session[key];
    });
    copy.clean_date = copy.clean_date || checkoutDate;
    copy.confirmation_codes = copy.confirmation_codes || [];
    if (confirmationCode && copy.confirmation_codes.indexOf(confirmationCode) === -1) {
      copy.confirmation_codes.push(confirmationCode);
    }
    return copy;
  }

  function collectCheckoutSessions() {
    var sessionMap = {};
    (checkoutData || []).forEach(function(day) {
      (day.by_property || []).forEach(function(group) {
        (group.bookings || []).forEach(function(booking) {
          (booking.sessions || []).forEach(function(session) {
            if (!session || session.session_id == null) return;
            var sessionId = String(session.session_id);
            if (!sessionMap[sessionId]) {
              sessionMap[sessionId] = normalizeSession(session, day.checkout_date, booking.confirmation_code);
            } else if (booking.confirmation_code && sessionMap[sessionId].confirmation_codes.indexOf(booking.confirmation_code) === -1) {
              sessionMap[sessionId].confirmation_codes.push(booking.confirmation_code);
            }
          });
        });
      });

      (day.unassigned || []).forEach(function(booking) {
        (booking.sessions || []).forEach(function(session) {
          if (!session || session.session_id == null) return;
          var sessionId = String(session.session_id);
          if (!sessionMap[sessionId]) {
            sessionMap[sessionId] = normalizeSession(session, day.checkout_date, booking.confirmation_code);
          } else if (booking.confirmation_code && sessionMap[sessionId].confirmation_codes.indexOf(booking.confirmation_code) === -1) {
            sessionMap[sessionId].confirmation_codes.push(booking.confirmation_code);
          }
        });
      });
    });
    return sessionMap;
  }

  function findCheckoutSession(sessionId) {
    return collectCheckoutSessions()[String(sessionId)] || null;
  }

  function sessionsForCleanerDate(cleanerId, cleanDate) {
    var sessionMap = collectCheckoutSessions();
    return Object.keys(sessionMap).map(function(sessionId) {
      return sessionMap[sessionId];
    }).filter(function(session) {
      return String(session.cleaner_id) === String(cleanerId) && String(session.clean_date) === String(cleanDate);
    });
  }

  function showEditSessionAlert(type, message) {
    document.getElementById('edit-session-alert').innerHTML =
      '<div class="alert alert-' + type + '" style="margin-bottom:12px;">' + escapeHtml(message) + '</div>';
  }

  function clearEditSessionAlert() {
    document.getElementById('edit-session-alert').innerHTML = '';
  }

  function renderRelatedCleanerSessions(cleanerId, cleanDate, activeSessionId) {
    var sessions = sessionsForCleanerDate(cleanerId, cleanDate);
    if (!sessions.length) {
      document.getElementById('edit-session-related').innerHTML = '<p class="text-muted">No other sessions found.</p>';
      return;
    }

    var rows = sessions.map(function(session) {
      var isActive = String(session.session_id) === String(activeSessionId);
      var hours = Number.isFinite(Number(session.hours)) ? Math.max(0, Math.floor(Number(session.hours))) : 0;
      var minutes = Number.isFinite(Number(session.minutes)) ? Math.max(0, Math.floor(Number(session.minutes))) : 0;
      minutes = Math.min(59, minutes);
      var fixCost = Number.isFinite(Number(session.fix_cost)) ? Math.max(0, Number(session.fix_cost)) : 0;
      return '<tr' + (isActive ? ' class="info"' : '') + '>' +
        '<td>#' + escapeHtml(session.session_id) + (isActive ? ' <span class="label label-primary">editing</span>' : '') + '</td>' +
        '<td>' + escapeHtml(session.cleaner_name || 'Unknown') + '</td>' +
        '<td>' + escapeHtml(String(hours) + 'h ' + String(minutes).padStart(2, '0') + 'm') + '</td>' +
        '<td>£' + escapeHtml(fixCost.toFixed(2)) + '</td>' +
        '<td>' + (session.paid_status ? '<span class="label label-success">Paid</span>' : '<span class="label label-default">Unpaid</span>') + '</td>' +
        '<td>' + escapeHtml((session.confirmation_codes || []).join(', ')) + '</td>' +
        '<td>' + escapeHtml(session.notes || '') + '</td>' +
        '<td>' +
          '<button type="button" class="btn btn-danger btn-xs modal-delete-session-btn" ' +
            'data-session-id="' + escapeHtml(session.session_id) + '" ' +
            'data-session-label="#' + escapeHtml(session.session_id) + '">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('edit-session-related').innerHTML =
      '<div class="table-responsive">' +
        '<table class="table table-condensed table-bordered" style="margin-bottom:0;">' +
          '<thead><tr><th>Session</th><th>Cleaner</th><th>Time</th><th>Fix Cost</th><th>Paid</th><th>Bookings</th><th>Notes</th><th>Action</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>';
  }

  function openEditSessionModal(sessionId) {
    var session = findCheckoutSession(sessionId);
    if (!session) {
      showError('Could not find session #' + sessionId + '. Please reload and try again.');
      return;
    }

    clearEditSessionAlert();
    document.getElementById('edit-session-modal-title').textContent =
      'Edit session #' + session.session_id + ' - ' + (session.cleaner_name || 'Unknown');
    document.getElementById('edit-session-id').value = session.session_id;
    document.getElementById('edit-cleaner-id').innerHTML = cleanerOptionsHtml(session.cleaner_id);
    document.getElementById('edit-clean-date').value = session.clean_date || '';
    var editHours = Number.isFinite(Number(session.hours)) ? Math.max(0, Math.floor(Number(session.hours))) : 0;
    var editMinutes = Number.isFinite(Number(session.minutes)) ? Math.min(59, Math.max(0, Math.floor(Number(session.minutes)))) : 0;
    document.getElementById('edit-start-time').value = '10:00';
    document.getElementById('edit-finish-time').value = finishTimeFromDuration('10:00', editHours, editMinutes);
    document.getElementById('edit-fix-cost').value = Number.isFinite(Number(session.fix_cost)) ? Math.max(0, Number(session.fix_cost)).toFixed(2) : '0.00';
    document.getElementById('edit-paid-status').checked = !!session.paid_status;
    document.getElementById('edit-confirmation-codes').value = (session.confirmation_codes || []).join(', ');
    document.getElementById('edit-notes').value = session.notes || '';
    renderRelatedCleanerSessions(session.cleaner_id, session.clean_date, session.session_id);
    $('#edit-session-modal').modal('show');
  }

  function modalSessionDetails() {
    var duration = durationFromTimeInputs('edit-start-time', 'edit-finish-time');
    var fixCostRaw = Number(document.getElementById('edit-fix-cost').value || 0);
    var fixCost = Number.isFinite(fixCostRaw) ? Math.max(0, fixCostRaw) : 0;
    var confirmationCodes = document.getElementById('edit-confirmation-codes').value
      .split(',')
      .map(function(code) { return code.trim(); })
      .filter(function(code) { return !!code; });

    return {
      cleaner_id: Number(document.getElementById('edit-cleaner-id').value),
      clean_date: document.getElementById('edit-clean-date').value,
      hours: duration.hours,
      minutes: duration.minutes,
      duration_error: duration.error,
      notes: document.getElementById('edit-notes').value || '',
      fix_cost: fixCost,
      paid_status: document.getElementById('edit-paid-status').checked,
      confirmation_codes: confirmationCodes
    };
  }

  function deleteCleaningSessionFromModal(sessionId, buttonEl) {
    if (!sessionId) {
      showEditSessionAlert('danger', 'Missing session id.');
      return;
    }

    if (!window.confirm('Delete cleaning session #' + sessionId + '? This cannot be undone.')) {
      return;
    }

    var activeSessionId = document.getElementById('edit-session-id').value;
    var cleanerId = document.getElementById('edit-cleaner-id').value;
    var cleanDate = document.getElementById('edit-clean-date').value;
    var originalText = buttonEl ? buttonEl.textContent : '';
    if (buttonEl) {
      buttonEl.disabled = true;
      buttonEl.textContent = 'Deleting...';
    }
    clearEditSessionAlert();

    $.ajax({
      url: API + '/cleaning-sessions/' + encodeURIComponent(String(sessionId)),
      method: 'DELETE'
    })
      .done(function() {
        clearError();
        if (String(sessionId) === String(activeSessionId)) {
          $('#edit-session-modal').modal('hide');
        } else if (cleanerId && cleanDate && activeSessionId) {
          renderRelatedCleanerSessions(cleanerId, cleanDate, activeSessionId);
        }
        loadCheckout();
      })
      .fail(function(xhr) {
        var message = 'Could not delete session';
        if (xhr && xhr.responseJSON && xhr.responseJSON.detail) {
          message += ': ' + xhr.responseJSON.detail;
        } else if (xhr && xhr.status) {
          message += ' (HTTP ' + xhr.status + ')';
        }
        showEditSessionAlert('danger', message);
      })
      .always(function() {
        if (buttonEl) {
          buttonEl.disabled = false;
          buttonEl.textContent = originalText || 'Delete';
        }
      });
  }

  function saveEditSessionModal() {
    var sessionId = document.getElementById('edit-session-id').value;
    var payload = modalSessionDetails();
    if (!sessionId) {
      showEditSessionAlert('danger', 'Missing session id.');
      return;
    }
    if (!payload.cleaner_id) {
      showEditSessionAlert('danger', 'Please select a cleaner.');
      return;
    }
    if (!payload.clean_date) {
      showEditSessionAlert('danger', 'Please choose a clean date.');
      return;
    }
    if (!payload.confirmation_codes.length) {
      showEditSessionAlert('danger', 'Please enter at least one confirmation code.');
      return;
    }
    if (payload.duration_error) {
      showEditSessionAlert('danger', payload.duration_error);
      return;
    }
    delete payload.duration_error;

    var button = document.getElementById('edit-session-save-btn');
    button.disabled = true;
    button.textContent = 'Saving...';
    clearEditSessionAlert();

    $.ajax({
      url: API + '/cleaning-sessions/' + encodeURIComponent(String(sessionId)),
      method: 'PATCH',
      contentType: 'application/json',
      data: JSON.stringify(payload)
    })
      .done(function() {
        $('#edit-session-modal').modal('hide');
        clearError();
        loadCheckout();
      })
      .fail(function(xhr) {
        var message = 'Could not update session';
        if (xhr && xhr.responseJSON && xhr.responseJSON.detail) {
          message += ': ' + xhr.responseJSON.detail;
        } else if (xhr && xhr.status) {
          message += ' (HTTP ' + xhr.status + ')';
        }
        showEditSessionAlert('danger', message);
      })
      .always(function() {
        button.disabled = false;
        button.textContent = 'Save changes';
      });
  }

  function showError(message) {
    document.getElementById('alerts').innerHTML =
      '<div class="alert alert-danger"><strong>Error:</strong> ' + escapeHtml(message) + '</div>';
  }

  function clearError() {
    document.getElementById('alerts').innerHTML = '';
  }

  function renderSessionCleanerFilterOptions() {
    var select = document.getElementById('session-cleaner-filter');
    var currentValue = select.value || selectedSessionCleanerId;
    var options = '<option value="">All cleaners</option>' +
      '<option value="__unassigned">Unassigned sessions</option>';

    options += cleaners.map(function(cleaner) {
      return '<option value="' + escapeHtml(cleaner.id) + '">' + escapeHtml(cleaner.name) + '</option>';
    }).join('');

    select.innerHTML = options;
    select.value = currentValue;
    if (select.value !== currentValue) {
      select.value = '';
      selectedSessionCleanerId = '';
    }
  }

  function sessionsMatchCleanerFilter(sessions) {
    if (!selectedSessionCleanerId) return true;
    if (selectedSessionCleanerId === '__unassigned') {
      return !sessions || sessions.length === 0;
    }
    return (sessions || []).some(function(session) {
      return session && String(session.cleaner_id) === String(selectedSessionCleanerId);
    });
  }

  function sessionsMatchPaidStatusFilter(sessions) {
    if (!selectedSessionPaidStatus) return true;
    return (sessions || []).some(function(session) {
      if (!session) return false;
      return selectedSessionPaidStatus === 'paid' ? !!session.paid_status : !session.paid_status;
    });
  }

  function dateFromIso(isoDate) {
    var parts = String(isoDate || '').split('-');
    if (parts.length !== 3) return null;

    var year = Number(parts[0]);
    var month = Number(parts[1]);
    var day = Number(parts[2]);
    if (!Number.isFinite(year) || !Number.isFinite(month) || !Number.isFinite(day)) return null;

    return new Date(year, month - 1, day);
  }

  function getThisWeekRange() {
    var today = new Date();
    var start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var daysSinceMonday = (start.getDay() + 6) % 7;
    start.setDate(start.getDate() - daysSinceMonday);

    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    end.setDate(start.getDate() + 6);

    return { start: start, end: end };
  }

  function checkoutDateMatchesThisWeek(checkoutDate) {
    if (!thisWeekFilterActive) return true;

    var date = dateFromIso(checkoutDate);
    if (!date) return false;

    var range = getThisWeekRange();
    return date >= range.start && date <= range.end;
  }

  function updateThisWeekButton() {
    var button = document.getElementById('this-week-btn');
    if (!button) return;

    button.classList.toggle('btn-info', thisWeekFilterActive);
    button.classList.toggle('btn-default', !thisWeekFilterActive);
    button.setAttribute('aria-pressed', thisWeekFilterActive ? 'true' : 'false');
  }

  function toggleThisWeekFilter() {
    thisWeekFilterActive = !thisWeekFilterActive;
    updateThisWeekButton();
    renderCheckoutRows(checkoutData);
  }

  function scrollCheckoutDateToToday() {
    var todayIso = new Date().toISOString().slice(0, 10);
    var wrap = document.querySelector('.checkout-table-wrap');
    var row = document.querySelector('#checkout-body tr[data-checkout-date="' + todayIso + '"]');
    if (!wrap || !row) {
      showError('No checkout rows found for today (' + todayIso + ').');
      return;
    }
    clearError();
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cleanerSelectHtml(property, checkoutDate, key, sessions) {
    if (!property || !checkoutDate || !key) {
      return '<span class="text-muted">Missing group data</span>';
    }
    if (!cleaners.length) {
      return '<span class="text-muted">No cleaners found</span>';
    }
    var assignedCleanerId = sessions && sessions.length ? sessions[0].cleaner_id : null;
    var options = '<option value=""' + (assignedCleanerId == null ? ' selected' : '') + '></option>';
    options += cleaners.map(function(cleaner) {
      var isAssignedCleaner = assignedCleanerId != null && String(cleaner.id) === String(assignedCleanerId);
      return '<option value="' + escapeHtml(cleaner.id) + '"' + (isAssignedCleaner ? ' selected' : '') + '>' + escapeHtml(cleaner.name) + '</option>';
    }).join('');

    return '<select class="form-control input-sm cleaner-select" data-group-key="' + escapeHtml(key) + '">' + options + '</select>';
  }

  function actionButtonHtml(group, key) {
    var property = group && group.property;
    var checkoutDate = group && group.checkout_date;
    var bookingCodes = group && group.confirmation_codes;
    var buttonLabel = 'Save';
    if (!property || !checkoutDate || !bookingCodes || !bookingCodes.length) {
      return '<button type=\"button\" class=\"btn btn-default btn-xs\" disabled>' + buttonLabel + '</button>';
    }
    if (!key) {
      return '<button type=\"button\" class=\"btn btn-default btn-xs\" disabled>' + buttonLabel + '</button>';
    }
    saveGroups[key] = {
      property: property,
      checkout_date: checkoutDate,
      confirmation_codes: bookingCodes.slice()
    };
    return '<button type=\"button\" class=\"btn btn-success btn-xs save-session-btn\" data-group-key=\"' + key + '\">' + buttonLabel + '</button>';
  }

  function deleteButtonHtml(group, key) {
    var property = group && group.property;
    var checkoutDate = group && group.checkout_date;
    var bookingCodes = group && group.confirmation_codes;
    var sessions = group && group.sessions;
    if (!property || !checkoutDate || !bookingCodes || !bookingCodes.length) {
      return '<button type="button" class="btn btn-default btn-xs" disabled>Delete</button>';
    }
    if (!sessions || !sessions.length) {
      return '<button type="button" class="btn btn-default btn-xs" disabled>No Session</button>';
    }
    if (!key) {
      return '<button type="button" class="btn btn-default btn-xs" disabled>Delete</button>';
    }
    return '<button type="button" class="btn btn-danger btn-xs delete-session-btn" data-group-key="' + escapeHtml(key) + '">Delete</button>';
  }


  function normalizeCleaners(data) {
    var list = Array.isArray(data) ? data : (data && Array.isArray(data.cleaners) ? data.cleaners : []);
    var seen = {};

    return list.map(function(item) {
      var id = item && (item.cleaner_id != null ? item.cleaner_id : item.id);
      return {
        id: id,
        name: item && (item.cleaner_name || item.name || ('Cleaner #' + id))
      };
    }).filter(function(item) {
      if (item.id == null || seen[String(item.id)]) return false;
      seen[String(item.id)] = true;
      return true;
    });
  }

  function addCheckoutCleaners(data) {
    var existing = {};
    cleaners.forEach(function(cleaner) {
      existing[String(cleaner.id)] = true;
    });

    (data || []).forEach(function(day) {
      (day.by_property || []).forEach(function(group) {
        (group.bookings || []).forEach(function(booking) {
          (booking.sessions || []).forEach(function(session) {
            if (session.cleaner_id == null || existing[String(session.cleaner_id)]) return;
            cleaners.push({
              id: session.cleaner_id,
              name: session.cleaner_name || ('Cleaner #' + session.cleaner_id)
            });
            existing[String(session.cleaner_id)] = true;
          });
        });
      });

      (day.unassigned || []).forEach(function(booking) {
        (booking.sessions || []).forEach(function(session) {
          if (session.cleaner_id == null || existing[String(session.cleaner_id)]) return;
          cleaners.push({
            id: session.cleaner_id,
            name: session.cleaner_name || ('Cleaner #' + session.cleaner_id)
          });
          existing[String(session.cleaner_id)] = true;
        });
      });
    });
  }

  function loadCleaners() {
    return $.getJSON(API + '/cleaners/')
      .done(function(data) {
        cleaners = normalizeCleaners(data);
        renderSessionCleanerFilterOptions();
      });
  }

  function renderCheckoutRows(data) {
    var tbody = document.getElementById('checkout-body');
    saveGroups = {};

    var rows = [];
    var rowCounter = 0;
    var totalRows = 0;
    var visibleRows = 0;

    (data || []).forEach(function(day) {
      (day.by_property || []).forEach(function(group) {
        var bookings = group.bookings || [];
        var confirmationCodes = bookings
          .map(function(booking) { return booking.confirmation_code; })
          .filter(function(code) { return !!code; })
          .filter(function(code, index, arr) { return arr.indexOf(code) === index; });
        var sessions = [];
        bookings.forEach(function(booking) {
          if (booking.sessions && booking.sessions.length) {
            sessions = sessions.concat(booking.sessions);
          }
        });
        sessions = uniqueSessionsById(sessions);
        totalRows += 1;

        if (!checkoutDateMatchesThisWeek(day.checkout_date) || !sessionsMatchCleanerFilter(sessions) || !sessionsMatchPaidStatusFilter(sessions)) {
          return;
        }
        visibleRows += 1;
        rowCounter += 1;
        var rowKey = 'group-' + rowCounter;

        rows.push(
          '<tr data-checkout-date="' + escapeHtml(day.checkout_date) + '">' +
            '<td>' + escapeHtml(day.total) + '</td>' +
            '<td>' + escapeHtml(day.checkout_date) + '</td>' +
            '<td>' + escapeHtml(group.property) + '</td>' +
            '<td>' + escapeHtml(group.count) + '</td>' +
            '<td>' + bookings.map(function(booking) { return escapeHtml(booking.listing_number || '-'); }).join('<br>') + '</td>' +
            '<td>' + sessionText(sessions) + '</td>' +
            '<td>' + sessionTimeText(sessions) + '</td>' +
            '<td>' + sessionFixCostText(sessions) + '</td>' +
            '<td>' + cleanerSelectHtml(group.property, day.checkout_date, rowKey, sessions) + '</td>' +
            '<td>' + actionButtonHtml({
              property: group.property,
              confirmation_codes: confirmationCodes,
              checkout_date: day.checkout_date
            }, rowKey) + '</td>' +
            '<td>' + deleteButtonHtml({
              property: group.property,
              confirmation_codes: confirmationCodes,
              checkout_date: day.checkout_date,
              sessions: sessions
            }, rowKey) + '</td>' +
          '</tr>'
        );
      });

      (day.unassigned || []).forEach(function(booking) {
        var unassignedSessions = uniqueSessionsById(booking.sessions || []);
        totalRows += 1;

        if (!checkoutDateMatchesThisWeek(day.checkout_date) || !sessionsMatchCleanerFilter(unassignedSessions) || !sessionsMatchPaidStatusFilter(unassignedSessions)) {
          return;
        }
        visibleRows += 1;
        rowCounter += 1;
        var unassignedRowKey = 'group-' + rowCounter;

        rows.push(
          '<tr class="warning" data-checkout-date="' + escapeHtml(day.checkout_date) + '">' +
            '<td>' + escapeHtml(day.total) + '</td>' +
            '<td>' + escapeHtml(day.checkout_date) + '</td>' +
            '<td><span class="label label-warning">Unassigned property</span></td>' +
            '<td>-</td>' +
            '<td>' + escapeHtml(booking.listing_number || '-') + '</td>' +
            '<td>' + sessionText(unassignedSessions) + '</td>' +
            '<td>' + sessionTimeText(unassignedSessions) + '</td>' +
            '<td>' + sessionFixCostText(unassignedSessions) + '</td>' +
            '<td>' + cleanerSelectHtml('unassigned:' + booking.confirmation_code, day.checkout_date, unassignedRowKey, unassignedSessions) + '</td>' +
            '<td>' + actionButtonHtml({
              property: 'unassigned:' + booking.confirmation_code,
              confirmation_codes: booking.confirmation_code ? [booking.confirmation_code] : [],
              checkout_date: day.checkout_date
            }, unassignedRowKey) + '</td>' +
            '<td>' + deleteButtonHtml({
              property: 'unassigned:' + booking.confirmation_code,
              confirmation_codes: booking.confirmation_code ? [booking.confirmation_code] : [],
              checkout_date: day.checkout_date,
              sessions: unassignedSessions
            }, unassignedRowKey) + '</td>' +
          '</tr>'
        );
      });
    });

    if (rows.length === 0) {
      var emptyMessage = 'No checkout data found.';
      var activeFilters = [];
      if (thisWeekFilterActive) activeFilters.push('this week');
      if (selectedSessionCleanerId) activeFilters.push('sessions cleaner');
      if (selectedSessionPaidStatus) activeFilters.push('paid status');
      if (activeFilters.length) {
        emptyMessage = 'No checkout rows match the active ' + activeFilters.join(', ') + ' filter' + (activeFilters.length === 1 ? '' : 's') + '.';
      }
      tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">' + emptyMessage + '</td></tr>';
    } else {
      tbody.innerHTML = rows.join('');
    }

    var summary = document.getElementById('filter-summary');
    summary.textContent = (selectedSessionCleanerId || selectedSessionPaidStatus || thisWeekFilterActive) ? 'Showing ' + visibleRows + ' of ' + totalRows + ' rows' : '';
  }

  function loadCheckout() {
    var tbody = document.getElementById('checkout-body');
    tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">Loading...</td></tr>';
    saveGroups = {};

    $.getJSON(API + '/bookings/checkout/')
      .done(function(data) {
        clearError();
        checkoutData = data || [];
        addCheckoutCleaners(checkoutData);
        renderSessionCleanerFilterOptions();
        document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleString();
        renderCheckoutRows(checkoutData);
      })
      .fail(function(xhr) {
        var message = 'Could not load /bookings/checkout/';
        if (xhr && xhr.status) {
          message += ' (HTTP ' + xhr.status + ')';
        }
        showError(message);
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">Failed to load data.</td></tr>';
      });
  }


  function sessionDetails() {
    var duration = durationFromTimeInputs('start-time-input', 'finish-time-input');
    var notes = document.getElementById('notes-input').value || '';
    var fixCostRaw = Number(document.getElementById('fix-cost-input').value || 0);

    var fixCost = Number.isFinite(fixCostRaw) ? Math.max(0, fixCostRaw) : 0;

    return {
      hours: duration.hours,
      minutes: duration.minutes,
      duration_error: duration.error,
      notes: notes,
      fix_cost: fixCost
    };
  }

  function saveCleaningSession(group, cleanerId, buttonEl) {
    var confirmationCodes = group && group.confirmation_codes;
    var cleanDate = group && group.checkout_date;
    if (!confirmationCodes || !confirmationCodes.length || !cleanDate) {
      showError('Missing booking confirmation codes or checkout date.');
      return;
    }

    buttonEl.disabled = true;
    buttonEl.textContent = 'Saving...';

    var details = sessionDetails();
    if (details.duration_error) {
      showError(details.duration_error);
      buttonEl.disabled = false;
      buttonEl.textContent = 'Save';
      return;
    }

    $.ajax({
      url: API + '/cleaning-sessions/',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        cleaner_id: Number(cleanerId),
        clean_date: cleanDate,
        hours: details.hours,
        minutes: details.minutes,
        notes: details.notes,
        fix_cost: details.fix_cost,
        confirmation_codes: confirmationCodes
      })
    })
      .done(function() {
        buttonEl.textContent = 'Saved';
        loadCheckout();
      })
      .fail(function(xhr) {
        var message = 'Could not create session';
        if (xhr && xhr.status) {
          message += ' (HTTP ' + xhr.status + ')';
        }
        showError(message);
        buttonEl.disabled = false;
        buttonEl.textContent = 'Save';
      });
  }


  function deleteSessionsForGroup(groupKeyValue, buttonEl) {
    var group = saveGroups[groupKeyValue];
    if (!group || !group.confirmation_codes || !group.confirmation_codes.length) {
      showError('Missing confirmation codes for delete request.');
      return;
    }

    if (!window.confirm('Delete all cleaning sessions linked to these confirmation codes?')) {
      return;
    }

    var originalText = buttonEl.textContent;
    buttonEl.disabled = true;
    buttonEl.textContent = 'Deleting...';

    $.ajax({
      url: API + '/cleaning-sessions/',
      method: 'DELETE',
      contentType: 'application/json',
      data: JSON.stringify({ confirmation_codes: group.confirmation_codes })
    })
      .done(function() {
        clearError();
        loadCheckout();
      })
      .fail(function(xhr) {
        var message = 'Delete request failed';
        if (xhr && xhr.responseJSON && xhr.responseJSON.detail) {
          message += ': ' + xhr.responseJSON.detail;
        } else if (xhr && xhr.status) {
          message += ' (HTTP ' + xhr.status + ')';
        }
        showError(message);
      })
      .always(function() {
        buttonEl.disabled = false;
        buttonEl.textContent = originalText;
      });
  }

  document.getElementById('checkout-body').addEventListener('click', function(event) {
    var editBtn = event.target.closest('.edit-session-btn');
    if (editBtn) {
      openEditSessionModal(editBtn.getAttribute('data-session-id'));
      return;
    }

    var saveBtn = event.target.closest('.save-session-btn');
    if (saveBtn) {
      var groupKeyValue = saveBtn.getAttribute('data-group-key');
      var group = saveGroups[groupKeyValue];
      if (!group) {
        showError('Could not find booking group for this row. Please reload and try again.');
        return;
      }
      var select = document.querySelector('.cleaner-select[data-group-key="' + groupKeyValue + '"]');
      if (!select || !select.value) {
        showError('Please select a cleaner.');
        return;
      }
      saveCleaningSession(group, select.value, saveBtn);
      return;
    }

    var deleteBtn = event.target.closest('.delete-session-btn');
    if (deleteBtn) {
      var deleteKey = deleteBtn.getAttribute('data-group-key');
      deleteSessionsForGroup(deleteKey, deleteBtn);
    }
  });

  document.getElementById('edit-session-related').addEventListener('click', function(event) {
    var deleteBtn = event.target.closest('.modal-delete-session-btn');
    if (!deleteBtn) return;
    deleteCleaningSessionFromModal(deleteBtn.getAttribute('data-session-id'), deleteBtn);
  });
  document.getElementById('reload-btn').addEventListener('click', function() {
    loadCleaners().always(loadCheckout);
  });
  document.getElementById('edit-session-save-btn').addEventListener('click', saveEditSessionModal);
  document.getElementById('edit-cleaner-id').addEventListener('change', function() {
    var cleanerId = document.getElementById('edit-cleaner-id').value;
    var cleanDate = document.getElementById('edit-clean-date').value;
    var sessionId = document.getElementById('edit-session-id').value;
    if (cleanerId && cleanDate && sessionId) {
      renderRelatedCleanerSessions(cleanerId, cleanDate, sessionId);
    }
  });
  document.getElementById('edit-clean-date').addEventListener('change', function() {
    var cleanerId = document.getElementById('edit-cleaner-id').value;
    var cleanDate = document.getElementById('edit-clean-date').value;
    var sessionId = document.getElementById('edit-session-id').value;
    if (cleanerId && cleanDate && sessionId) {
      renderRelatedCleanerSessions(cleanerId, cleanDate, sessionId);
    }
  });
  document.getElementById('scroll-today-btn').addEventListener('click', scrollCheckoutDateToToday);
  document.getElementById('this-week-btn').addEventListener('click', toggleThisWeekFilter);
  document.getElementById('session-cleaner-filter').addEventListener('change', function(event) {
    selectedSessionCleanerId = event.target.value;
    renderCheckoutRows(checkoutData);
  });
  document.getElementById('session-paid-status-filter').addEventListener('change', function(event) {
    selectedSessionPaidStatus = event.target.value;
    renderCheckoutRows(checkoutData);
  });
  updateThisWeekButton();
  renderSessionCleanerFilterOptions();
  loadCleaners()
    .done(loadCheckout)
    .fail(function(xhr) {
      var message = 'Could not load /cleaners';
      if (xhr && xhr.status) {
        message += ' (HTTP ' + xhr.status + ')';
      }
      showError(message);
      loadCheckout();
    });
</script>

</body>
</html>
