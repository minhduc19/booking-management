<!DOCTYPE html>
<html lang="en">
<head>
  <title>Listing Metadata</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <div class="container" style="margin-top:30px; margin-bottom:30px; max-width:1100px;">
    <div class="page-header">
      <h2>Listing Metadata <small>Manage listing details</small></h2>
    </div>

    <div id="alerts" aria-live="polite"></div>

    <div class="panel panel-default">
      <div class="panel-heading"><strong id="form-title">Add listing</strong></div>
      <div class="panel-body">
        <form id="listing-form">
          <input id="metadata-id" type="hidden">
          <div class="row">
            <div class="col-sm-5 form-group">
              <label for="listing">Listing name</label>
              <input id="listing" class="form-control" type="text" required maxlength="255" autocomplete="off">
            </div>
            <div class="col-sm-4 form-group">
              <label for="listing-number">Listing number</label>
              <input id="listing-number" class="form-control" type="text" maxlength="255" autocomplete="off">
            </div>
            <div class="col-sm-3 form-group">
              <label for="property-id">Property ID <small class="text-muted">optional</small></label>
              <input id="property-id" class="form-control" type="number" min="1" step="1" inputmode="numeric">
            </div>
          </div>
          <button id="save-btn" class="btn btn-primary" type="submit">
            <span class="glyphicon glyphicon-plus"></span> Add listing
          </button>
          <button id="cancel-edit-btn" class="btn btn-default" type="button" style="display:none; margin-left:8px;">Cancel</button>
        </form>
      </div>
    </div>

    <div class="panel panel-default">
      <div class="panel-heading clearfix">
        <strong>Listings</strong>
        <button id="reload-btn" class="btn btn-default btn-xs pull-right" type="button">
          <span class="glyphicon glyphicon-refresh"></span> Reload
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped table-hover" style="margin-bottom:0;">
          <thead>
            <tr><th>Listing</th><th>Listing number</th><th>Property</th><th class="text-right">Actions</th></tr>
          </thead>
          <tbody id="listing-table-body">
            <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var API = window.location.origin;
    var listings = [];

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showAlert(type, message) {
      document.getElementById('alerts').innerHTML =
        '<div class="alert alert-' + type + ' alert-dismissible" role="alert">' +
        '<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>' +
        escapeHtml(message) + '</div>';
    }

    function requestError(xhr, fallback) {
      try {
        return JSON.parse(xhr.responseText).detail || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function renderListings() {
      var body = document.getElementById('listing-table-body');
      if (!listings.length) {
        body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No listing metadata has been added.</td></tr>';
        return;
      }

      body.innerHTML = listings.map(function(item) {
        var property = item.property ? item.property.address + ' (ID ' + item.property.id + ')' :
          (item.property_id ? 'ID ' + item.property_id : 'Not assigned');
        return '<tr>' +
          '<td>' + escapeHtml(item.listing) + '</td>' +
          '<td>' + escapeHtml(item.listing_number || '—') + '</td>' +
          '<td>' + escapeHtml(property) + '</td>' +
          '<td class="text-right">' +
          '<button class="btn btn-default btn-xs" type="button" data-action="edit" data-id="' + item.id + '">Edit</button> ' +
          '<button class="btn btn-danger btn-xs" type="button" data-action="delete" data-id="' + item.id + '">Delete</button>' +
          '</td></tr>';
      }).join('');
    }

    function loadListings() {
      document.getElementById('listing-table-body').innerHTML =
        '<tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>';
      $.ajax({
        url: API + '/listing-metadata/',
        type: 'GET',
        success: function(data) {
          listings = data;
          renderListings();
        },
        error: function(xhr) {
          document.getElementById('listing-table-body').innerHTML =
            '<tr><td colspan="4" class="text-center text-danger">Unable to load listings.</td></tr>';
          showAlert('danger', requestError(xhr, 'Unable to load listing metadata.'));
        }
      });
    }

    function resetForm() {
      document.getElementById('listing-form').reset();
      document.getElementById('metadata-id').value = '';
      document.getElementById('form-title').textContent = 'Add listing';
      document.getElementById('save-btn').innerHTML = '<span class="glyphicon glyphicon-plus"></span> Add listing';
      document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    document.getElementById('listing-form').addEventListener('submit', function(event) {
      event.preventDefault();
      var metadataId = document.getElementById('metadata-id').value;
      var propertyValue = document.getElementById('property-id').value;
      var payload = {
        listing: document.getElementById('listing').value.trim(),
        listing_number: document.getElementById('listing-number').value.trim() || null,
        property_id: propertyValue ? Number(propertyValue) : null
      };
      var saveButton = document.getElementById('save-btn');
      saveButton.disabled = true;

      $.ajax({
        url: API + '/listing-metadata/' + (metadataId ? metadataId : ''),
        type: metadataId ? 'PATCH' : 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload),
        success: function() {
          showAlert('success', metadataId ? 'Listing updated.' : 'Listing added.');
          resetForm();
          loadListings();
        },
        error: function(xhr) {
          showAlert('danger', requestError(xhr, 'Unable to save listing metadata.'));
        },
        complete: function() {
          saveButton.disabled = false;
        }
      });
    });

    document.getElementById('listing-table-body').addEventListener('click', function(event) {
      var button = event.target.closest('button[data-action]');
      if (!button) return;
      var item = listings.find(function(listing) { return listing.id === Number(button.dataset.id); });
      if (!item) return;

      if (button.dataset.action === 'edit') {
        document.getElementById('metadata-id').value = item.id;
        document.getElementById('listing').value = item.listing;
        document.getElementById('listing-number').value = item.listing_number || '';
        document.getElementById('property-id').value = item.property_id || '';
        document.getElementById('form-title').textContent = 'Edit listing';
        document.getElementById('save-btn').innerHTML = '<span class="glyphicon glyphicon-floppy-disk"></span> Save changes';
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
        document.getElementById('listing').focus();
        return;
      }

      if (window.confirm('Delete "' + item.listing + '"?')) {
        $.ajax({
          url: API + '/listing-metadata/' + item.id,
          type: 'DELETE',
          success: function() {
            showAlert('success', 'Listing deleted.');
            if (document.getElementById('metadata-id').value === String(item.id)) resetForm();
            loadListings();
          },
          error: function(xhr) {
            showAlert('danger', requestError(xhr, 'Unable to delete listing metadata.'));
          }
        });
      }
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);
    document.getElementById('reload-btn').addEventListener('click', loadListings);
    loadListings();
  </script>
</body>
</html>
